name: Deploy to Cloudflare Workers

# Deploys the two static projects — `frontend/` and `landing/` — to Cloudflare
# Workers static assets. The backend and database go to Coolify instead, via
# `deploy-coolify.yml`; on a release `release.yml` runs that first so the API is
# upgraded before the frontend that calls it (see deployment.md).
#
#   push to master    -> staging     (staging.shop-n-cook.com, app.staging.shop-n-cook.com)
#   called by release.yml -> production (shop-n-cook.com, app.shop-n-cook.com)
#   workflow_dispatch -> either, on demand
#
# Production is driven by the published release, not by the tag push, so it
# rolls out alongside the extension and app stores. The old `tags: ["v*"]`
# trigger never actually worked: bump-version.yml pushed the tag with
# GITHUB_TOKEN, which GitHub suppresses for triggering workflows, so this
# workflow had zero tag runs in its entire history.

on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: string
      ref:
        description: "Git ref to build from (defaults to the calling ref)"
        required: false
        type: string
    secrets:
      # Named rather than inherited.
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  # Never let two deploys of the same environment race each other.
  group: deploy-cloudflare-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:

  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # To check out .github/scripts/ below.
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      # For .github/scripts/ only; nothing is built here.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Resolve target environment
        id: resolve
        env:
          # Set for both workflow_call and workflow_dispatch; empty on push.
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: .github/scripts/deploy-cloudflare/resolve-target-environment.sh

  deploy:
    name: Deploy ${{ matrix.project }} (${{ needs.resolve-environment.outputs.environment }})
    needs: resolve-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve-environment.outputs.environment }}
    permissions:
      contents: read
    strategy:
      # A partial deploy is better than none — the landing page and the app are
      # independent Workers.
      fail-fast: false
      matrix:
        project:
          - frontend
          - landing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          # A production deploy builds the released tag, not whatever master has
          # drifted to since.
          ref: ${{ inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.project }}
        run: bun run --filter ${{ matrix.project }} build:${{ needs.resolve-environment.outputs.environment }}

      - name: Deploy ${{ matrix.project }} to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.project }}
          packageManager: bun
          command: deploy --env ${{ needs.resolve-environment.outputs.environment }}

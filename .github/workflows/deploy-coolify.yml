name: Deploy backend to Coolify

# Deploys `backend/` + the database — the stack described by the root
# `compose.yml` — by pointing a Coolify application at a git ref and asking it to
# redeploy. Coolify builds from source, so the ref it tracks *is* the version
# running in that environment.
#
#   called by release.yml -> production, pinned to the released tag
#   workflow_dispatch     -> either environment, any ref (also the rollback path)
#
# Staging is NOT driven from here on a schedule or on push: it keeps
# auto-deploying from `master` through the Coolify GitHub App. Production has
# that webhook turned off precisely so master pushes cannot reach it, which is
# what this workflow exists to replace — see deployment.md.

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: string
      ref:
        description: "Git ref for Coolify to track, e.g. v1.5.0"
        required: true
        type: string
      force:
        description: "Rebuild even if the ref already matches (skips the build cache)"
        required: false
        default: false
        type: boolean
    secrets:
      # Named rather than inherited. All three are required — the deploy job's
      # first step fails the run when any is missing, because a backend that
      # silently did not deploy is a frontend talking to the wrong API.
      COOLIFY_URL:
        required: false
      COOLIFY_API_TOKEN:
        required: false
      COOLIFY_APP_UUID:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: "Git ref for Coolify to track, e.g. v1.5.0. An older tag rolls production back."
        required: true
        type: string
      force:
        description: "Rebuild even if the ref already matches (skips the build cache)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Never let two deploys of the same environment race each other — the loser
  # would leave the application pinned to a ref nobody asked for.
  group: deploy-coolify-${{ inputs.environment }}
  cancel-in-progress: false

jobs:

  deploy:
    name: Deploy backend (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Generous, because the job waits on a container build happening on the
    # Coolify host rather than on this runner.
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # To check out .github/scripts/ below.
    steps:

      # Nothing is built from the repository here — the ref is resolved through
      # the API — but the steps below run scripts out of .github/scripts/, so
      # the tree has to be present.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Require Coolify credentials
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: .github/scripts/deploy-coolify/require-coolify-credentials.sh

      - name: Resolve ref, commit and expected version
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: .github/scripts/deploy-coolify/resolve-ref-commit-and-version.sh

      - name: Point the application at the ref
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          REF: ${{ inputs.ref }}
        run: .github/scripts/deploy-coolify/point-the-application-at-the-ref.sh

      - name: Trigger the deployment
        id: trigger
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          FORCE: ${{ inputs.force }}
        run: .github/scripts/deploy-coolify/trigger-the-deployment.sh

      - name: Wait for the build to finish
        if: steps.trigger.outputs.uuid != ''
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.uuid }}
        run: .github/scripts/deploy-coolify/wait-for-the-build-to-finish.sh

      - name: Verify the deployed backend
        id: verify
        env:
          API_HOST: ${{ steps.target.outputs.api_host }}
          EXPECTED: ${{ steps.target.outputs.version }}
        run: .github/scripts/deploy-coolify/verify-the-deployed-backend.sh

      - name: Report
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF: ${{ inputs.ref }}
          SHA: ${{ steps.target.outputs.sha }}
          EXPECTED: ${{ steps.target.outputs.version }}
          LIVE: ${{ steps.verify.outputs.live }}
          DEPLOYMENT: ${{ steps.trigger.outputs.uuid }}
          API_HOST: ${{ steps.target.outputs.api_host }}
        run: .github/scripts/deploy-coolify/report.sh

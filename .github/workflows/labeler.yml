name: Labels
# pull_request_target, so a pull request from a fork can be labelled — the
# `pull_request` token is read-only there, and a labeller that cannot label
# fork contributions labels nothing.
#
# Safe here for the one reason that makes this trigger safe anywhere: the fork's
# code is never checked out, built or run. There is no `actions/checkout` in
# this file at all; both jobs read the pull request's metadata through the API.
on:
  # zizmor: ignore[dangerous-triggers] -- no checkout of the head ref; see above
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

permissions: {}

jobs:
  labeler:
    name: Apply labels
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
      if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    - run: echo "Done adding labels"
  # Run this after labeler applied labels
  check-labels:
    name: Check labels
    timeout-minutes: 10
    needs:
      - labeler
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # A docker:// reference must be pinned by OCI digest (sha256:...), not by
      # a git commit SHA — the latter makes `docker pull` fail with
      # "invalid reference format". This digest is the v1.6.65 image.
      - uses: docker://agilepathway/pull-request-label-checker@sha256:14f5f3dfda922496d07d53494e2d2b42885165f90677a1c03d600059b7706a61 # v1.6.65
        with:
          one_of: breaking,security,feature,bug,refactor,upgrade,docs,lang-all,internal
          repo_token: ${{ secrets.GITHUB_TOKEN }}

name: Labels
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

jobs:
  labeler:
    name: Apply labels
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - name: GreenSecOps Telemetry
      uses: greensecops/greensecops-action@v1
      with:
        greensecops_url: ${{ vars.GREENSECOPS_URL || 'http://localhost:8000' }}
    - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
      if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    - run: echo "Done adding labels"
  # Run this after labeler applied labels
  check-labels:
    name: Check labels
    timeout-minutes: 10
    needs:
      - labeler
    permissions:
      id-token: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: GreenSecOps Telemetry
        uses: greensecops/greensecops-action@v1
        with:
          greensecops_url: ${{ vars.GREENSECOPS_URL || 'http://localhost:8000' }}
      - uses: docker://agilepathway/pull-request-label-checker@a91054365736411477123163354413645318356d # latest
        with:
          one_of: breaking,security,feature,bug,refactor,upgrade,docs,lang-all,internal
          repo_token: ${{ secrets.GITHUB_TOKEN }}

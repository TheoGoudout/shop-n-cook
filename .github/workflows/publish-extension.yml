name: Publish Extension

on:
  release:
    types: [released, prereleased]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # needed to attach the zip to the release

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version:  ${{ steps.version.outputs.version }}
      chrome:   ${{ steps.check.outputs.chrome }}
      firefox:  ${{ steps.check.outputs.firefox }}
      edge:     ${{ steps.check.outputs.edge }}
      opera:    ${{ steps.check.outputs.opera }}
      safari:   ${{ steps.check.outputs.safari }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Extract version from manifest
        id: version
        run: echo "version=$(jq -r '.version' extension/public/manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun ci
        working-directory: extension

      - name: Build
        run: bun run build
        working-directory: extension

      - name: Package zip
        run: cd extension/dist && zip -r ../../extension.zip .

      - name: Check secret availability
        id: check
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          FIREFOX_API_KEY:     ${{ secrets.FIREFOX_API_KEY }}
          EDGE_PRODUCT_ID:     ${{ secrets.EDGE_PRODUCT_ID }}
          OPERA_EMAIL:         ${{ secrets.OPERA_EMAIL }}
          APPLE_CERTIFICATE:   ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "chrome=$([ -n "$CHROME_EXTENSION_ID" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "firefox=$([ -n "$FIREFOX_API_KEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "edge=$([ -n "$EDGE_PRODUCT_ID" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "opera=$([ -n "$OPERA_EMAIL" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "safari=$([ -n "$APPLE_CERTIFICATE" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-zip
          path: extension.zip
          retention-days: 7

      - name: Attach zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: extension.zip

  publish-chrome:
    name: Publish → Chrome Web Store
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pre-releases are skipped — a version in review blocks further submissions, and RCs shouldn't queue ahead of the real release.
    if: github.event_name == 'release' && !github.event.release.prerelease && needs.build.outputs.chrome == 'true'
    # Also covers Vivaldi and Brave — both Chromium-based and use Chrome Web Store directly
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Get access token from service account
        id: token
        env:
          SA_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth requests -q
          TOKEN=$(python3 -c "
          import google.oauth2.service_account as sa, google.auth.transport.requests as req, json, os
          creds = sa.Credentials.from_service_account_info(
              json.loads(os.environ['SA_JSON']),
              scopes=['https://www.googleapis.com/auth/chromewebstore'],
          )
          creds.refresh(req.Request())
          print(creds.token)
          ")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload package
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          TOKEN:        ${{ steps.token.outputs.token }}
        run: |
          curl -sf -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -T extension.zip

      - name: Publish submission
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          TOKEN:        ${{ steps.token.outputs.token }}
        run: |
          RESULT=$(curl -s -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/json" \
            -d '{"target":"default"}')
          STATUS=$(echo "$RESULT" | jq -r '.status[0] // ""')
          ERROR=$(echo "$RESULT" | jq -r '.error.message // ""')
          # ITEM_PENDING_REVIEW = submitted for review (normal for broad-permission extensions)
          # "in review" error = previous submission still under review; new package uploaded as draft
          if [ "$STATUS" = "OK" ] || [ "$STATUS" = "ITEM_PENDING_REVIEW" ] || \
             echo "$ERROR" | grep -qi "in review"; then
            echo "Submitted: $STATUS $ERROR"
          else
            echo "Publish failed: $RESULT"
            exit 1
          fi

  publish-firefox:
    name: Publish → Firefox Add-ons (AMO)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pre-releases are skipped entirely — RC testers install extension.zip directly in Firefox Dev Edition.
    if: github.event_name == 'release' && !github.event.release.prerelease && needs.build.outputs.firefox == 'true'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Unzip extension
        run: mkdir ext-src && cd ext-src && unzip ../extension.zip

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install web-ext
        run: bun add -g web-ext

      - name: Sign & submit to AMO
        id: sign
        run: |
          # Always "listed" (appears publicly on addons.mozilla.org): the job's `if`
          # above already excludes pre-releases, so the unlisted path was unreachable.
          # RC testers install extension.zip directly in Firefox Dev Edition instead.
          CHANNEL=listed
          web-ext sign \
            --source-dir ext-src \
            --channel "$CHANNEL" \
            --api-key "${{ secrets.FIREFOX_API_KEY }}" \
            --api-secret "${{ secrets.FIREFOX_API_SECRET }}" \
            --artifacts-dir /tmp/web-ext-artifacts
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Attach XPI to release
        run: |
          XPI=$(find /tmp/web-ext-artifacts -name "*.xpi" -print -quit)
          if [ -n "$XPI" ]; then
            cp "$XPI" "shop-n-cook-${{ needs.build.outputs.version }}.xpi"
          fi

      - name: Upload XPI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firefox-xpi
          path: shop-n-cook-${{ needs.build.outputs.version }}.xpi
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach XPI to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: false
          files: shop-n-cook-${{ needs.build.outputs.version }}.xpi

      # Requires FIREFOX_EXTENSION_SLUG repository variable (Settings → Variables → Actions).
      # Value: the slug or GUID of the add-on on addons.mozilla.org.
      - name: Set release notes on AMO
        if: vars.FIREFOX_EXTENSION_SLUG != ''
        env:
          ADDON_SLUG:   ${{ vars.FIREFOX_EXTENSION_SLUG }}
          API_KEY:      ${{ secrets.FIREFOX_API_KEY }}
          API_SECRET:   ${{ secrets.FIREFOX_API_SECRET }}
          VERSION:      ${{ needs.build.outputs.version }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          JWT=$(python3 - <<'EOF'
          import hmac, hashlib, base64, json, time, os
          def b64url(data):
              if isinstance(data, str): data = data.encode()
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()
          now = int(time.time())
          hdr = b64url(json.dumps({"alg": "HS256", "typ": "JWT"}))
          pld = b64url(json.dumps({"iss": os.environ["API_KEY"], "iat": now, "exp": now + 60}))
          msg = f"{hdr}.{pld}"
          sig = b64url(hmac.new(os.environ["API_SECRET"].encode(), msg.encode(), hashlib.sha256).digest())
          print(f"{msg}.{sig}")
          EOF
          )
          NOTES_JSON=$(python3 -c 'import json,os; print(json.dumps(os.environ["RELEASE_BODY"]))')
          curl -sf -X PATCH \
            "https://addons.mozilla.org/api/v5/addons/addon/${ADDON_SLUG}/versions/${VERSION}/" \
            -H "Authorization: JWT $JWT" \
            -H "Content-Type: application/json" \
            -d "{\"release_notes\":{\"en-US\":${NOTES_JSON}}}"

  publish-edge:
    name: Publish → Edge Add-ons
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' && !github.event.release.prerelease && needs.build.outputs.edge == 'true'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Get Azure AD access token
        id: token
        run: |
          TOKEN=$(curl -sf -X POST \
            "https://login.microsoftonline.com/${{ secrets.EDGE_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.EDGE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.EDGE_CLIENT_SECRET }}" \
            -d "scope=https://api.addons.microsoftedge.microsoft.com/.default" \
            -d "grant_type=client_credentials" \
            | jq -r '.access_token')
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload package
        run: |
          curl -sf -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${{ secrets.EDGE_PRODUCT_ID }}/submissions/draft/package" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/zip" \
            --data-binary @extension.zip

      - name: Publish submission
        run: |
          curl -sf -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${{ secrets.EDGE_PRODUCT_ID }}/submissions" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}"

  publish-opera:
    name: Publish → Opera Add-ons
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Opera has no staging channel — skip on pre-releases entirely.
    if: github.event_name == 'release' && !github.event.release.prerelease && needs.build.outputs.opera == 'true'
    # Opera has no official REST API; automation uses Puppeteer via ext-opera-upload.
    # reCAPTCHA Enterprise may block uploads — continue-on-error prevents failing the release.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Install ext-opera-upload
        run: npm install -g ext-opera-upload

      - name: Upload to Opera Add-ons
        run: |
          ext-opera-upload \
            --email "${{ secrets.OPERA_EMAIL }}" \
            --password "${{ secrets.OPERA_PASSWORD }}" \
            --extension-id "${{ secrets.OPERA_EXTENSION_ID }}" \
            --zip extension.zip
        continue-on-error: true

  publish-safari:
    name: Publish → Safari (Mac App Store)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name == 'release' && needs.build.outputs.safari == 'true'
    # pre-release and full release follow the same upload path.
    # Every build lands in TestFlight first; App Store review must be submitted manually
    # from App Store Connect — there is no API to trigger it automatically.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Unzip extension
        run: mkdir ext-src && cd ext-src && unzip ../extension.zip

      - name: Convert to Xcode project
        run: |
          xcrun safari-web-extension-converter ext-src \
            --app-name "ShopNCook" \
            --bundle-identifier com.shopncook.extension \
            --swift \
            --no-open

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          echo "$PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          xcodebuild archive \
            -project ShopNCook/ShopNCook.xcodeproj \
            -scheme ShopNCook \
            -archivePath build/ShopNCook.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ShopNCook.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Set up App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type macos \
            --file build/export/*.pkg \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPLE_API_KEY_ISSUER_ID }}"

name: Publish Extension

# Called by release.yml when a release is published. Also dispatchable on its
# own to re-drive the browser stores for an existing release without
# resubmitting to the app stores.
#
# This used to listen for the `release` event directly and additionally build on
# every push to master, where every publish job then skipped — test-extension.yml
# already covers building the extension on master and PRs.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.5.0"
        required: true
        type: string
      version:
        description: "Version without the leading v, e.g. 1.5.0"
        required: true
        type: string
      prerelease:
        description: "Whether this is a pre-release"
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.5.0"
        required: true
        type: string
      version:
        description: "Version without the leading v, e.g. 1.5.0"
        required: true
        type: string
      prerelease:
        description: "Whether this is a pre-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write # needed to attach the zip to the release

concurrency:
  group: publish-extension-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # To attach the zip to the release.
    outputs:
      version: ${{ steps.version.outputs.version }}
      chrome: ${{ steps.check.outputs.chrome }}
      firefox: ${{ steps.check.outputs.firefox }}
      edge: ${{ steps.check.outputs.edge }}
      opera: ${{ steps.check.outputs.opera }}
      safari: ${{ steps.check.outputs.safari }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Resolve version
        id: version
        # Taken from the tag, not from the manifest. The manifest carries the
        # pre-release suffix stripped (Chrome rejects it), so reading it here
        # made v1.5.0-rc1 and v1.5.0-rc2 produce identically named release
        # assets that overwrote each other.
        env:
          VERSION: ${{ inputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci
        working-directory: extension

      - name: Build
        run: bun run build
        working-directory: extension

      - name: Package zip
        run: .github/scripts/publish-extension/package-zip.sh

      - name: Check secret availability
        id: check
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          OPERA_EMAIL: ${{ secrets.OPERA_EMAIL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        # Names only: the values are read from the environment above, never
        # passed as arguments.
        run: .github/scripts/shared/check-secret-availability.sh chrome=CHROME_EXTENSION_ID firefox=FIREFOX_API_KEY edge=EDGE_PRODUCT_ID opera=OPERA_EMAIL safari=APPLE_CERTIFICATE

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-zip
          path: extension.zip
          retention-days: 7

      - name: Attach zip to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Explicit, because on workflow_dispatch GITHUB_REF is a branch and
          # the action would otherwise not find the release to attach to.
          tag_name: ${{ inputs.tag }}
          files: extension.zip

  publish-chrome:
    name: Publish → Chrome Web Store
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # To check out .github/scripts/ below.
    # Pre-releases are skipped — a version in review blocks further submissions,
    # and RCs should not queue ahead of the real release.
    if: ${{ !inputs.prerelease && needs.build.outputs.chrome == 'true' }}
    # Also covers Vivaldi and Brave — both Chromium-based, both using the
    # Chrome Web Store directly.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Get access token from service account
        id: token
        env:
          SA_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
        run: .github/scripts/publish-extension/get-access-token-from-service-account.sh

      - name: Upload package
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: .github/scripts/publish-extension/upload-package.sh

      - name: Publish submission
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: .github/scripts/publish-extension/publish-submission.sh

  publish-firefox:
    name: Publish → Firefox Add-ons (AMO)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # To attach the signed XPI to the release.
    # Pre-releases are skipped entirely — RC testers install extension.zip
    # directly in Firefox Dev Edition.
    if: ${{ !inputs.prerelease && needs.build.outputs.firefox == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Unzip extension
        run: .github/scripts/publish-extension/unzip-extension.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install web-ext
        run: .github/scripts/publish-extension/install-web-ext.sh

      - name: Sign and submit to AMO
        id: sign
        env:
          API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
        run: .github/scripts/publish-extension/sign-and-submit-to-amo.sh

      - name: Attach XPI to release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/scripts/publish-extension/attach-xpi-to-release.sh

      - name: Upload XPI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firefox-xpi
          path: shop-n-cook-${{ needs.build.outputs.version }}.xpi
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach XPI to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: false
          files: shop-n-cook-${{ needs.build.outputs.version }}.xpi

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/shared/fetch-release-notes.sh

      # Requires the FIREFOX_EXTENSION_SLUG repository variable (Settings →
      # Variables → Actions): the slug or GUID of the add-on on AMO.
      - name: Set release notes on AMO
        if: vars.FIREFOX_EXTENSION_SLUG != ''
        env:
          ADDON_SLUG: ${{ vars.FIREFOX_EXTENSION_SLUG }}
          API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        run: .github/scripts/publish-extension/set-release-notes-on-amo.sh

  publish-edge:
    name: Publish → Edge Add-ons
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # To check out .github/scripts/ below.
    if: ${{ !inputs.prerelease && needs.build.outputs.edge == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Get Azure AD access token
        id: token
        env:
          TENANT_ID: ${{ secrets.EDGE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET }}
        run: .github/scripts/publish-extension/get-azure-ad-access-token.sh

      - name: Upload package to Edge
        env:
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: .github/scripts/publish-extension/upload-package-to-edge.sh

      - name: Publish Edge submission
        env:
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: .github/scripts/publish-extension/publish-edge-submission.sh

  publish-opera:
    name: Publish → Opera Add-ons
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # To check out .github/scripts/ below.
    # Opera has no staging channel — skipped on pre-releases entirely.
    if: ${{ !inputs.prerelease && needs.build.outputs.opera == 'true' }}
    # Opera has no official REST API; the uploader drives the partner site with
    # Puppeteer, and reCAPTCHA Enterprise sometimes blocks it.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install ext-opera-upload
        run: .github/scripts/publish-extension/install-ext-opera-upload.sh

      # `continue-on-error` on the upload alone, not on the job: a reCAPTCHA
      # block is the failure worth tolerating, and it used to swallow every
      # other one with it — a bad zip, expired credentials, a renamed flag. The
      # job still concludes as failure, so release.yml's table shows the Opera
      # row red instead of reporting a publish that never happened.
      - name: Upload to Opera Add-ons
        id: upload
        continue-on-error: true
        env:
          EMAIL: ${{ secrets.OPERA_EMAIL }}
          PASSWORD: ${{ secrets.OPERA_PASSWORD }}
          EXTENSION_ID: ${{ secrets.OPERA_EXTENSION_ID }}
        run: .github/scripts/publish-extension/upload-to-opera-add-ons.sh

      - name: Report the upload outcome
        if: steps.upload.outcome == 'failure'
        run: exit 1

  publish-safari:
    name: Publish → Safari (Mac App Store)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read # To check out the project the Xcode build needs.
    if: ${{ needs.build.outputs.safari == 'true' }}
    # Pre-release and full release follow the same upload path. Every build
    # lands in TestFlight first; App Store review has to be submitted by hand
    # from App Store Connect, as there is no API to trigger it.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-zip

      - name: Unzip extension
        run: .github/scripts/publish-extension/unzip-extension.sh

      - name: Convert to Xcode project
        run: .github/scripts/publish-extension/convert-to-xcode-project.sh

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: .github/scripts/publish-extension/import-signing-certificate.sh

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: .github/scripts/publish-extension/install-provisioning-profile.sh

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/publish-extension/archive.sh

      - name: Export archive
        run: .github/scripts/publish-extension/export-archive.sh

      - name: Set up App Store Connect API key
        env:
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: .github/scripts/publish-extension/set-up-app-store-connect-api-key.sh

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: .github/scripts/publish-extension/upload-to-app-store-connect.sh

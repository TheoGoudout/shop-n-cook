# Publishes the PWA as a native app to Google Play, App Store, and Windows Store.
#
# Triggers:
#   - Stable release  → production track on all stores
#   - Pre-release     → beta/TestFlight/flight track on all stores
#
# One-time setup required before this workflow runs:
#
#   ANDROID (Trusted Web Activity via Bubblewrap)
#     1. npm i -g @bubblewrap/cli
#     2. mkdir -p mobile/android && cd mobile/android
#        bubblewrap init --manifest https://<your-domain>/manifest.webmanifest
#     3. Commit the generated project (git add mobile/android/ — keystore is gitignored)
#     4. keytool -list -v -keystore mobile/android/android.keystore → copy SHA-256 fingerprint
#        → paste into frontend/public/.well-known/assetlinks.json
#     5. base64 -w0 mobile/android/android.keystore → save as secret ANDROID_KEYSTORE_BASE64
#     6. Create Google Play service account with "Release manager" role
#        → save JSON as secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#
#   iOS (PWABuilder-generated WKWebView app)
#     1. Go to pwabuilder.com → enter your URL → Download → iOS
#     2. Unzip into mobile/ios/ and commit
#     3. In Apple Developer Portal: create App ID, provisioning profile, distribution cert
#        base64 -w0 cert.p12  → APPLE_CERTIFICATE_BASE64
#        base64 -w0 app.mobileprovision → APPLE_PROVISIONING_PROFILE_BASE64
#     4. In App Store Connect: create API key (Admin role)
#        base64 -w0 AuthKey_XXXX.p8 → APPLE_API_KEY_BASE64
#
#   WINDOWS (MSIX via PWABuilder)
#     1. Go to pwabuilder.com → enter your URL → Download → Windows
#     2. Unzip into windows/ and commit
#     3. Purchase a code-signing cert (.pfx) or use Azure Trusted Signing
#        base64 -w0 cert.pfx → WINDOWS_CERTIFICATE_BASE64
#     4. Register an Azure AD app in Partner Center with "Manager" role
#        → save tenant/seller/client IDs and secret
#
# Required secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64             Base64-encoded .keystore file
#   ANDROID_KEYSTORE_PASSWORD           Keystore store password
#   ANDROID_KEY_PASSWORD                Signing key password
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON    Google Play service account JSON
#   APPLE_CERTIFICATE_BASE64            Base64-encoded .p12 distribution certificate
#   APPLE_CERTIFICATE_PASSWORD          Certificate password
#   APPLE_PROVISIONING_PROFILE_BASE64   Base64-encoded .mobileprovision
#   APPLE_API_KEY_ID                    App Store Connect API key ID (e.g. ABC123DEF4)
#   APPLE_API_KEY_ISSUER                App Store Connect issuer UUID
#   APPLE_API_KEY_BASE64                Base64-encoded .p8 key file
#   WINDOWS_CERTIFICATE_BASE64          Base64-encoded .pfx code-signing certificate
#   WINDOWS_CERTIFICATE_PASSWORD        PFX password
#   AZURE_TENANT_ID                     Azure AD tenant ID
#   AZURE_SELLER_ID                     Partner Center seller ID
#   AZURE_CLIENT_ID                     Azure AD app client ID
#   AZURE_CLIENT_SECRET                 Azure AD app client secret
#
# Required repository variables (Settings → Variables → Actions):
#   PWA_URL               Deployed PWA URL, e.g. https://app.shop-n-cook.goudout.com
#   ANDROID_PACKAGE_NAME  e.g. com.shopncook.app
#   ANDROID_KEY_ALIAS     Signing key alias inside the keystore
#   IOS_BUNDLE_ID         e.g. com.shopncook.app
#   IOS_TEAM_ID           Apple Developer Team ID
#   WINDOWS_PRODUCT_ID    Product ID from Partner Center dashboard
#   WINDOWS_FLIGHT_ID     Flight (package) ID for pre-release builds

name: Publish to App Stores

# Called by release.yml when a release is published. Also dispatchable on its
# own to re-drive the app stores for an existing release without resubmitting
# the browser extensions.
#
# This used to listen for the `release` event directly, and additionally ran on
# every push to master where it built a throwaway debug APK. That debug path is
# gone along with the push trigger.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.5.0"
        required: true
        type: string
      version:
        description: "Version without the leading v, e.g. 1.5.0"
        required: true
        type: string
      prerelease:
        description: "Whether this is a pre-release"
        required: true
        type: boolean
    secrets:
      # Named rather than inherited, for the same reason as
      # publish-extension.yml: this workflow signs and uploads to three app
      # stores, and has no business holding the deployment credentials.
      #
      # None is required — the prepare job's secret check skips the platforms
      # that are not configured.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_PROVISIONING_PROFILE_BASE64:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_KEY_ISSUER:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SELLER_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.5.0"
        required: true
        type: string
      version:
        description: "Version without the leading v, e.g. 1.5.0"
        required: true
        type: string
      prerelease:
        description: "Whether this is a pre-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write # needed to attach build artifacts to the release

concurrency:
  group: publish-stores-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # `latest` resolves the newest msstore-cli release at run time, which is what
  # this always did. Pin it to a tag (`v1.6.0`) to stop the tool that publishes
  # to the Store changing under a release.
  MSSTORE_CLI_VERSION: latest

jobs:
  # ── Shared metadata ────────────────────────────────────────────────────────
  prepare:
    name: Resolve tracks and available stores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # To check out .github/scripts/ below.
    outputs:
      version: ${{ inputs.version }}
      release_name: ${{ steps.release.outputs.name }}
      android_track: ${{ steps.track.outputs.android_track }}
      ios_lane: ${{ steps.track.outputs.ios_lane }}
      windows_beta: ${{ steps.track.outputs.windows_beta }}
      has_android: ${{ steps.check.outputs.has_android }}
      has_ios: ${{ steps.check.outputs.has_ios }}
      has_windows: ${{ steps.check.outputs.has_windows }}
    steps:
      # For .github/scripts/ only; nothing is built here.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # The Android versionCode used to be derived here and sed-injected into
      # build.gradle at build time. scripts/set-version.mjs now commits it, so
      # the formula lives in exactly one place and the repo tells the truth.
      - name: Resolve release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/publish-stores/resolve-release-metadata.sh

      - name: Resolve store tracks
        id: track
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: .github/scripts/publish-stores/resolve-store-tracks.sh

      - name: Check secret availability
        id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        # Names only: the values are read from the environment above, never
        # passed as arguments. Android needs both of its secrets, so its entry
        # names the pair.
        run: .github/scripts/shared/check-secret-availability.sh has_android=ANDROID_KEYSTORE_BASE64+GOOGLE_PLAY_SERVICE_ACCOUNT_JSON has_ios=APPLE_CERTIFICATE_BASE64 has_windows=WINDOWS_CERTIFICATE_BASE64

  # ── Android ────────────────────────────────────────────────────────────────
  android:
    name: Publish → Google Play (${{ needs.prepare.outputs.android_track }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # To attach the APK and AAB to the release.
    if: needs.prepare.outputs.has_android == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: .github/scripts/publish-stores/decode-keystore.sh

      - name: Convert keystore to legacy PKCS12
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: .github/scripts/publish-stores/convert-keystore-to-legacy-pkcs12.sh

      - name: Verify the checked-out version matches the release
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/publish-stores/verify-the-checked-out-version-matches-the-release.sh

      - name: Build signed AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .github/scripts/publish-stores/build-signed-aab.sh

      - name: Build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .github/scripts/publish-stores/build-signed-apk.sh

      - name: Rename release artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .github/scripts/publish-stores/rename-release-artifacts.sh

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-aab
          path: shop-n-cook-${{ needs.prepare.outputs.version }}.aab
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: shop-n-cook-${{ needs.prepare.outputs.version }}.apk
          retention-days: 7

      - name: Attach APK and AAB to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            shop-n-cook-${{ needs.prepare.outputs.version }}.apk
            shop-n-cook-${{ needs.prepare.outputs.version }}.aab

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/publish-stores/write-release-notes.sh

      - name: Upload to Google Play (${{ needs.prepare.outputs.android_track }})
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ needs.prepare.outputs.android_track }}
          releaseName: ${{ needs.prepare.outputs.release_name }}
          whatsNewDirectory: whats-new
          status: draft

  # ── iOS ────────────────────────────────────────────────────────────────────
  ios:
    name: Publish → App Store (${{ needs.prepare.outputs.ios_lane }})
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read # To check out the project Fastlane builds.
    if: needs.prepare.outputs.has_ios == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile/ios

      - name: Import distribution certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: .github/scripts/publish-stores/import-distribution-certificate.sh

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: .github/scripts/publish-stores/install-provisioning-profile.sh

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/shared/fetch-release-notes.sh

      - name: Build and upload via Fastlane (${{ needs.prepare.outputs.ios_lane }})
        working-directory: mobile/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_BASE64 }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
          LANE: ${{ needs.prepare.outputs.ios_lane }}
        run: bundle exec fastlane "$LANE"

  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    name: Publish → Microsoft Store
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # To attach the MSIX to the release.
    if: needs.prepare.outputs.has_windows == 'true'
    # PowerShell, so these scripts are .ps1 rather than .sh — see
    # .github/scripts/README.md. Everything else about them is the same: named
    # after their step, values through env, comments alongside the code.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Microsoft Store CLI
        env:
          MSSTORE_CLI_VERSION: ${{ env.MSSTORE_CLI_VERSION }}
        run: .github/scripts/publish-stores/install-microsoft-store-cli.ps1

      - name: Package MSIX
        run: .github/scripts/publish-stores/package-msix.ps1

      - name: Sign MSIX
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: .github/scripts/publish-stores/sign-msix.ps1

      - name: Authenticate Store CLI
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SELLER_ID: ${{ secrets.AZURE_SELLER_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: .github/scripts/publish-stores/authenticate-store-cli.ps1

      - name: Publish to Windows Store
        env:
          PRODUCT_ID: ${{ vars.WINDOWS_PRODUCT_ID }}
          FLIGHT_ID: ${{ vars.WINDOWS_FLIGHT_ID }}
          WINDOWS_BETA: ${{ needs.prepare.outputs.windows_beta }}
        run: .github/scripts/publish-stores/publish-to-windows-store.ps1

      - name: Rename MSIX for release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .github/scripts/publish-stores/rename-msix-for-release.ps1

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-msix
          path: shop-n-cook-${{ needs.prepare.outputs.version }}.msix
          retention-days: 7

      - name: Attach MSIX to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: shop-n-cook-${{ needs.prepare.outputs.version }}.msix

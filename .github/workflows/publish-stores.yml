# Publishes the PWA as a native app to Google Play, App Store, and Windows Store.
#
# Triggers:
#   - Stable release  → production track on all stores
#   - Pre-release     → beta/TestFlight/flight track on all stores
#
# One-time setup required before this workflow runs:
#
#   ANDROID (Trusted Web Activity via Bubblewrap)
#     1. npm i -g @bubblewrap/cli
#     2. mkdir -p mobile/android && cd mobile/android
#        bubblewrap init --manifest https://<your-domain>/manifest.webmanifest
#     3. Commit the generated project (git add mobile/android/ — keystore is gitignored)
#     4. keytool -list -v -keystore mobile/android/android.keystore → copy SHA-256 fingerprint
#        → paste into frontend/public/.well-known/assetlinks.json
#     5. base64 -w0 mobile/android/android.keystore → save as secret ANDROID_KEYSTORE_BASE64
#     6. Create Google Play service account with "Release manager" role
#        → save JSON as secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#
#   iOS (PWABuilder-generated WKWebView app)
#     1. Go to pwabuilder.com → enter your URL → Download → iOS
#     2. Unzip into mobile/ios/ and commit
#     3. In Apple Developer Portal: create App ID, provisioning profile, distribution cert
#        base64 -w0 cert.p12  → APPLE_CERTIFICATE_BASE64
#        base64 -w0 app.mobileprovision → APPLE_PROVISIONING_PROFILE_BASE64
#     4. In App Store Connect: create API key (Admin role)
#        base64 -w0 AuthKey_XXXX.p8 → APPLE_API_KEY_BASE64
#
#   WINDOWS (MSIX via PWABuilder)
#     1. Go to pwabuilder.com → enter your URL → Download → Windows
#     2. Unzip into windows/ and commit
#     3. Purchase a code-signing cert (.pfx) or use Azure Trusted Signing
#        base64 -w0 cert.pfx → WINDOWS_CERTIFICATE_BASE64
#     4. Register an Azure AD app in Partner Center with "Manager" role
#        → save tenant/seller/client IDs and secret
#
# Required secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64             Base64-encoded .keystore file
#   ANDROID_KEYSTORE_PASSWORD           Keystore store password
#   ANDROID_KEY_PASSWORD                Signing key password
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON    Google Play service account JSON
#   APPLE_CERTIFICATE_BASE64            Base64-encoded .p12 distribution certificate
#   APPLE_CERTIFICATE_PASSWORD          Certificate password
#   APPLE_PROVISIONING_PROFILE_BASE64   Base64-encoded .mobileprovision
#   APPLE_API_KEY_ID                    App Store Connect API key ID (e.g. ABC123DEF4)
#   APPLE_API_KEY_ISSUER                App Store Connect issuer UUID
#   APPLE_API_KEY_BASE64                Base64-encoded .p8 key file
#   WINDOWS_CERTIFICATE_BASE64          Base64-encoded .pfx code-signing certificate
#   WINDOWS_CERTIFICATE_PASSWORD        PFX password
#   AZURE_TENANT_ID                     Azure AD tenant ID
#   AZURE_SELLER_ID                     Partner Center seller ID
#   AZURE_CLIENT_ID                     Azure AD app client ID
#   AZURE_CLIENT_SECRET                 Azure AD app client secret
#
# Required repository variables (Settings → Variables → Actions):
#   PWA_URL               Deployed PWA URL, e.g. https://app.shop-n-cook.goudout.com
#   ANDROID_PACKAGE_NAME  e.g. com.shopncook.app
#   ANDROID_KEY_ALIAS     Signing key alias inside the keystore
#   IOS_BUNDLE_ID         e.g. com.shopncook.app
#   IOS_TEAM_ID           Apple Developer Team ID
#   WINDOWS_PRODUCT_ID    Product ID from Partner Center dashboard
#   WINDOWS_FLIGHT_ID     Flight (package) ID for pre-release builds

name: Publish to App Stores

# Called by release.yml when a release is published. Also dispatchable on its
# own to re-drive the app stores for an existing release without resubmitting
# the browser extensions.
#
# This used to listen for the `release` event directly, and additionally ran on
# every push to master where it built a throwaway debug APK. That debug path is
# gone along with the push trigger.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.5.0"
        required: true
        type: string
      version:
        description: "Version without the leading v, e.g. 1.5.0"
        required: true
        type: string
      prerelease:
        description: "Whether this is a pre-release"
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.5.0"
        required: true
        type: string
      version:
        description: "Version without the leading v, e.g. 1.5.0"
        required: true
        type: string
      prerelease:
        description: "Whether this is a pre-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write # needed to attach build artifacts to the release

concurrency:
  group: publish-stores-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # ── Shared metadata ────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version:       ${{ inputs.version }}
      release_name:  ${{ steps.release.outputs.name }}
      android_track: ${{ steps.track.outputs.android_track }}
      ios_lane:      ${{ steps.track.outputs.ios_lane }}
      windows_beta:  ${{ steps.track.outputs.windows_beta }}
      has_android:   ${{ steps.check.outputs.has_android }}
      has_ios:       ${{ steps.check.outputs.has_ios }}
      has_windows:   ${{ steps.check.outputs.has_windows }}
    steps:
      # The Android versionCode used to be derived here and sed-injected into
      # build.gradle at build time. scripts/set-version.mjs now commits it, so
      # the formula lives in exactly one place and the repo tells the truth.
      - name: Resolve release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          NAME=$(gh release view "$TAG" --repo "${{ github.repository }}" --json name --jq '.name // ""')
          echo "name=${NAME:-$TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve store tracks
        id: track
        run: |
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "android_track=internal"   >> "$GITHUB_OUTPUT"
            echo "ios_lane=beta"            >> "$GITHUB_OUTPUT"
            echo "windows_beta=true"        >> "$GITHUB_OUTPUT"
          else
            echo "android_track=alpha"      >> "$GITHUB_OUTPUT"
            echo "ios_lane=release"         >> "$GITHUB_OUTPUT"
            echo "windows_beta=false"       >> "$GITHUB_OUTPUT"
          fi

      - name: Check secret availability
        id: check
        env:
          ANDROID_KEYSTORE_BASE64:          ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APPLE_CERTIFICATE_BASE64:         ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_BASE64:       ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          echo "has_android=$([ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_ios=$([ -n "$APPLE_CERTIFICATE_BASE64" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_windows=$([ -n "$WINDOWS_CERTIFICATE_BASE64" ] && echo true || echo false)" >> $GITHUB_OUTPUT

  # ── Android ────────────────────────────────────────────────────────────────
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.prepare.outputs.has_android == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | tr -d '[:space:]' | base64 -d > mobile/android/android.keystore

      - name: Convert keystore to legacy PKCS12
        working-directory: mobile/android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # bundletool ships its own Bouncy Castle that chokes on newer AES-256 PKCS12 files;
          # re-key to the legacy 3DES format that all BC versions can read.
          keytool -importkeystore \
            -srckeystore android.keystore \
            -srcstoretype PKCS12 \
            -srcstorepass "$STORE_PASS" \
            -destkeystore android-legacy.keystore \
            -deststoretype PKCS12 \
            -deststorepass "$STORE_PASS" \
            -noprompt \
            -J-Dkeystore.pkcs12.legacy
          mv android-legacy.keystore android.keystore

      - name: Verify the checked-out version matches the release
        working-directory: mobile/android/app
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(grep -oP '(?<=versionName ")[^"]*' build.gradle)
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::build.gradle says versionName $ACTUAL but the release is $VERSION."
            exit 1
          fi
          echo "build.gradle is at $ACTUAL (versionCode $(grep -oP '(?<=versionCode )\d+' build.gradle))."

      - name: Build signed AAB
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/android.keystore" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ vars.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build signed APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/android.keystore" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ vars.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Rename release artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab \
             "shop-n-cook-${VERSION}.aab"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             "shop-n-cook-${VERSION}.apk"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-aab
          path: shop-n-cook-${{ needs.prepare.outputs.version }}.aab
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: shop-n-cook-${{ needs.prepare.outputs.version }}.apk
          retention-days: 7

      - name: Attach APK and AAB to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            shop-n-cook-${{ needs.prepare.outputs.version }}.apk
            shop-n-cook-${{ needs.prepare.outputs.version }}.aab

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p whats-new
          # Read from the release rather than github.event.release.body, which is
          # empty when this workflow is called rather than triggered directly.
          gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body \
            > whats-new/whatsnew-en-US

      - name: Upload to Google Play (${{ needs.prepare.outputs.android_track }})
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ needs.prepare.outputs.android_track }}
          releaseName: ${{ needs.prepare.outputs.release_name }}
          whatsNewDirectory: whats-new
          status: draft

  # ── iOS ────────────────────────────────────────────────────────────────────
  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    if: needs.prepare.outputs.has_ios == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile/ios

      - name: Import distribution certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: tmp-${{ github.run_id }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            "$(security list-keychains -d user | head -1 | tr -d '"')"

      - name: Install provisioning profile
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" \
            | base64 -d > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "body<<RELEASE_BODY_EOF"
            gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload via Fastlane (${{ needs.prepare.outputs.ios_lane }})
        working-directory: mobile/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID:        ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APP_STORE_CONNECT_API_KEY_CONTENT:   ${{ secrets.APPLE_API_KEY_BASE64 }}
          BUNDLE_ID:                           ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID:                             ${{ vars.IOS_TEAM_ID }}
          RELEASE_NOTES:                       ${{ steps.notes.outputs.body }}
        run: bundle exec fastlane ${{ needs.prepare.outputs.ios_lane }}

  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    if: needs.prepare.outputs.has_windows == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install Microsoft Store CLI
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/microsoft/msstore-cli/releases/latest"
          $url = ($release.assets | Where-Object { $_.name -match 'win-x64' -and $_.name -match '\.zip$' }).browser_download_url
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\msstore.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\msstore.zip" -DestinationPath "$env:RUNNER_TEMP\msstore"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\msstore"

      - name: Package MSIX
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "makeappx.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          & $makeAppx pack /d windows /p "$env:RUNNER_TEMP\ShopNCook.msix" /nv

      - name: Sign MSIX
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /p $env:CERT_PASSWORD /f $certPath `
            "$env:RUNNER_TEMP\ShopNCook.msix"

      - name: Authenticate Store CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId     "${{ secrets.AZURE_TENANT_ID }}" `
            --sellerId     "${{ secrets.AZURE_SELLER_ID }}" `
            --clientId     "${{ secrets.AZURE_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_CLIENT_SECRET }}"

      - name: Publish to Windows Store
        shell: pwsh
        run: |
          $msix      = "$env:RUNNER_TEMP\ShopNCook.msix"
          $productId = "${{ vars.WINDOWS_PRODUCT_ID }}"
          if ("${{ needs.prepare.outputs.windows_beta }}" -eq "true") {
            msstore publish -i $msix --id $productId --flightId "${{ vars.WINDOWS_FLIGHT_ID }}"
          } else {
            msstore publish -i $msix --id $productId
          }

      - name: Rename MSIX for release
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP\ShopNCook.msix" `
            "shop-n-cook-${{ needs.prepare.outputs.version }}.msix"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-msix
          path: shop-n-cook-${{ needs.prepare.outputs.version }}.msix
          retention-days: 7

      - name: Attach MSIX to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: shop-n-cook-${{ needs.prepare.outputs.version }}.msix

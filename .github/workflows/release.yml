name: Release

# Step 2 of 2 of the release process (see .claude/skills/release/SKILL.md).
#
# Fires when the draft release created by release-prepare.yml is published,
# which is also the moment GitHub creates the tag. Everything a release ships is
# driven from here as called workflows, so the whole rollout is a single run:
# one place to see status, and "Re-run failed jobs" re-drives only the store
# that broke rather than resubmitting to all of them.
#
# Which environments it deploys follows from the release itself:
#
#   pre-release -> staging, if enabled       (stores: beta / test tracks)
#   release     -> production, and staging   (stores: production tracks)
#                  if enabled
#
# Staging is opt-in: set the STAGING_ENABLED repository variable to `true`.
# Without it a pre-release deploys nothing and a release production alone.
#
# deploy-environment.yml does each environment's rollout, so staging and
# production are the same jobs with a different GitHub Environment. Dev is not
# here: it deploys itself from master (see deployment.md).
#
# Previously each publisher listened for the `release` event independently,
# which meant no shared status, no partial retry, and a trigger asymmetry where
# flipping a pre-release to a full release re-ran the extension publish but not
# the store publish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)publish, e.g. v1.5.0"
        required: true
        type: string
      targets:
        description: "Which targets to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - extension
          - stores
          - cloudflare
          - coolify

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      run_extension: ${{ steps.targets.outputs.extension }}
      run_stores: ${{ steps.targets.outputs.stores }}
      run_cloudflare: ${{ steps.targets.outputs.cloudflare }}
      run_coolify: ${{ steps.targets.outputs.coolify }}
      environments: ${{ steps.environments.outputs.environments }}
    steps:
      # The steps below run scripts from .github/scripts/, and one of them calls
      # scripts/set-version.mjs, so this job needs the tree even though it
      # builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # No cache. This job installs nothing — it runs set-version.mjs, which
          # is dependency-free — so there is nothing for a restored cache to
          # speed up, and this workflow is privileged: it is triggered by a
          # published release and its called workflows hold every store
          # credential. A cache entry poisoned by a less-privileged workflow has
          # no business being restored here. (zizmor: cache-poisoning)
          no-cache: true

      - name: Resolve tag, version and pre-release flag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/release/resolve-tag-version-and-pre-release-flag.sh

      - name: Resolve targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: .github/scripts/release/resolve-targets.sh

      - name: Resolve environments
        id: environments
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          STAGING_ENABLED: ${{ vars.STAGING_ENABLED }}
        run: .github/scripts/release/resolve-environments.sh

  extension:
    name: Browser extensions
    needs: resolve
    if: needs.resolve.outputs.run_extension == 'true'
    # A called workflow's token is capped by the caller, and these publishers
    # attach build artifacts to the release.
    permissions:
      contents: write
    # `./`, not GitHub's newer `$/`: moving the release pipeline to a
    # different reference syntax is a deliberate change, not a lint fix.
    uses: ./.github/workflows/publish-extension.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
    # Named rather than inherited. `secrets: inherit` hands the called
    # workflow every secret this repository holds — so a browser-store
    # publisher was also carrying the Coolify API token and the release
    # PAT. Each workflow now declares what it needs, and gets that.
    secrets:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
      FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
      FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
      EDGE_TENANT_ID: ${{ secrets.EDGE_TENANT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      OPERA_EMAIL: ${{ secrets.OPERA_EMAIL }}
      OPERA_PASSWORD: ${{ secrets.OPERA_PASSWORD }}
      OPERA_EXTENSION_ID: ${{ secrets.OPERA_EXTENSION_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}

  stores:
    name: App stores
    needs: resolve
    if: needs.resolve.outputs.run_stores == 'true'
    permissions:
      contents: write
    # `./`, not GitHub's newer `$/`: moving the release pipeline to a
    # different reference syntax is a deliberate change, not a lint fix.
    uses: ./.github/workflows/publish-stores.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SELLER_ID: ${{ secrets.AZURE_SELLER_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  images:
    name: Backend image
    needs: resolve
    # Built only when it is about to be deployed: same condition as the
    # backend half of the deploy job.
    if: needs.resolve.outputs.run_coolify == 'true' && needs.resolve.outputs.environments != '[]'
    permissions:
      contents: read
      packages: write # images.yml pushes the backend image to GHCR.
    # `./`, not GitHub's newer `$/`: moving the release pipeline to a
    # different reference syntax is a deliberate change, not a lint fix.
    uses: ./.github/workflows/images.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  deploy:
    name: Deploy ${{ matrix.environment }}
    # Behind the image build: the Coolify hosts pull the image rather than
    # building it, so it has to exist first. A failed image build skips every
    # environment; a skipped one (targets: cloudflare) does not.
    needs: [resolve, images]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.images.result != 'failure' &&
      needs.images.result != 'cancelled' &&
      needs.resolve.outputs.environments != '[]' &&
      (needs.resolve.outputs.run_coolify == 'true' || needs.resolve.outputs.run_cloudflare == 'true')
    strategy:
      # Staging and production roll out side by side; one failing does not
      # cancel the other.
      fail-fast: false
      matrix:
        # production for a release; with STAGING_ENABLED, staging as well, and
        # for a pre-release staging alone (resolve-environments.sh).
        environment: ${{ fromJSON(needs.resolve.outputs.environments) }}
    permissions:
      contents: read
    # `./`, not GitHub's newer `$/`: moving the release pipeline to a
    # different reference syntax is a deliberate change, not a lint fix.
    uses: ./.github/workflows/deploy-environment.yml # zizmor: ignore[self-repository]
    with:
      environment: ${{ matrix.environment }}
      ref: ${{ needs.resolve.outputs.tag }}
      coolify: ${{ needs.resolve.outputs.run_coolify == 'true' }}
      cloudflare: ${{ needs.resolve.outputs.run_cloudflare == 'true' }}
    secrets:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release-complete:
    name: Release complete
    needs: [resolve, extension, stores, images, deploy]
    # Runs even when a target failed or was skipped, so the run's conclusion is
    # the release's conclusion rather than just the last job's.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # To check out .github/scripts/ below.
    steps:
      # The steps below run scripts from .github/scripts/, so this job needs the
      # repository even though it builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          STORES_RESULT: ${{ needs.stores.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ENVIRONMENTS: ${{ needs.resolve.outputs.environments }}
        run: .github/scripts/release/report.sh

      - name: Fail if any target failed
        env:
          EXTENSION_RESULT: ${{ needs.extension.result }}
          STORES_RESULT: ${{ needs.stores.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: .github/scripts/release/fail-if-any-target-failed.sh

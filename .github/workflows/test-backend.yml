name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

# Cancelled for a pull request, because a superseded commit's checks are an
# answer about code nobody is going to merge. Not cancelled for a push to
# master: that run uploads the coverage smokeshow.yml publishes, and a cancelled
# one leaves the commit without it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CI only talks to throwaway containers, so the example settings (and
      # their dummy credentials) are fine and need no repository secrets. That
      # also lets Dependabot and fork PRs, which can't read secrets, run CI.
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # --wait, so the migrations below never race Postgres starting up.
      - name: Start Postgres and MailCatcher
        run: docker compose up -d --wait db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Check the migrations match the models
        run: uv run alembic check
        working-directory: backend
      - name: Run tests
        env:
          SHA: ${{ github.sha }}
        run: uv run bash scripts/tests-start.sh "Coverage for ${SHA}"
        working-directory: backend
      - name: Stop the containers
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 7
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend

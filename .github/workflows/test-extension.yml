name: Test Extension

on:
  push:
    branches:
      - master
    paths:
      - extension/**
      - .github/workflows/test-extension.yml
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - extension/**
      - .github/workflows/test-extension.yml

jobs:
  test-extension:
    name: Test & Build Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: extension/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('extension/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install
        working-directory: extension
      - name: Type check
        run: bun run type-check
        working-directory: extension
      - name: Lint
        run: bun run lint
        working-directory: extension
      - name: Test
        run: bun run test
        working-directory: extension
      - name: Build
        run: bun run build
        working-directory: extension
      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-dist
          path: extension/dist/
          retention-days: 7

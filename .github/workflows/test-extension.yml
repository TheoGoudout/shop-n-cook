name: Test Extension

on:
  push:
    branches:
      - master
    paths:
      - extension/**
      - .github/workflows/test-extension.yml
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - extension/**
      - .github/workflows/test-extension.yml

jobs:
  test-extension:
    name: Test & Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
        working-directory: extension
      - name: Type check
        run: bun run type-check
        working-directory: extension
      - name: Lint
        run: bun run lint
        working-directory: extension
      - name: Test
        run: bun run test
        working-directory: extension
      - name: Build
        run: bun run build
        working-directory: extension
      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: extension/dist/
          retention-days: 7

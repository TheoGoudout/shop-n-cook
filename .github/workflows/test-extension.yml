name: Test Extension

# Runs on every pull request, and skips the work in a job instead of skipping
# the workflow with an `on: paths:` filter. A workflow filtered out by `paths:`
# reports no check at all, so a required check on it waits forever on any pull
# request that does not touch the extension; a skipped job reports, and the
# alls-green job below turns "skipped" into a pass.

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API.
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - extension/**
              - package.json
              - bun.lock
              - .bun-version
              - .github/workflows/test-extension.yml

  test-extension:
    name: Test & Build Extension
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun ci
        working-directory: extension
      - name: Type check
        run: bun run type-check
        working-directory: extension
      - name: Lint
        run: bun run lint
        working-directory: extension
      - name: Test
        run: bun run test
        working-directory: extension
      - name: Build
        run: bun run build
        working-directory: extension
      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-dist
          path: extension/dist/
          retention-days: 7

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-extension: # The one check branch protection should require.
    name: All extension checks passed
    if: always()
    needs:
      - changes
      - test-extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # Reads `needs`; touches nothing.
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-extension

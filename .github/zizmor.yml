# zizmor's ruleset for this repository.
# Schema: https://docs.zizmor.sh/configuration/
#
# Two kinds of entry belong here and nothing else:
#
#   1. Policies that ratchet in a practice we already follow, so that losing it
#      is a failing check rather than a quiet regression.
#   2. Suppressions for findings that are wrong *about this repository* rather
#      than wrong in general — and each one has to say why.
#
# Everything else gets fixed in the workflow. A suppression added because a
# finding was inconvenient is how a linter becomes decoration.
#
# A per-file, per-line exception belongs next to the line it excuses, as a
# `# zizmor: ignore[audit-id] reason` comment, not here. This file is for
# repository-wide policy.
#
# Note: audit IDs are not validated. A typo here silently configures nothing,
# so check any edit with `uvx zizmor --no-online-audits .` before pushing.

rules:
  # Which actions this repository is allowed to run at all.
  #
  # Pinning is already handled without configuration: zizmor's default
  # `unpinned-uses` policy is hash-pin, and every `uses:` here is SHA-pinned
  # (the Docker one by OCI digest). What pinning cannot do is stop a *new*
  # action from a party we have never vetted appearing in a workflow — a pinned
  # SHA of an untrusted action is still an untrusted action running with our
  # token, and this repository's workflows hold store credentials for five
  # browser stores and three app stores.
  #
  # This allowlist is that gate. Introducing an action from a publisher not
  # named below now requires a deliberate edit to this file, which shows up in
  # review as "we are trusting someone new".
  forbidden-uses:
    config:
      allow:
        # GitHub-maintained, and the runtime this repository is built on.
        - actions/*
        # zizmor's own action, which is what runs this policy.
        - zizmorcore/*
        # Toolchains and platforms the build depends on by construction.
        - astral-sh/*
        - cloudflare/*
        - oven-sh/*
        - ruby/*
        # `collect: all` reaches .pre-commit-config.yaml too, so the hook
        # repositories are held to the same allowlist as the actions. That is
        # the right bar — a pre-commit hook runs arbitrary code on a
        # contributor's machine and in the pre-commit job.
        - pre-commit/*
        - compilerla/conventional-pre-commit
        - shellcheck-py/shellcheck-py
        # Vetted individually — single-purpose actions, no org-wide trust.
        - agilepathway/pull-request-label-checker
        - dorny/paths-filter
        - mxschmitt/action-tmate
        - nick-fields/retry
        - pre-commit-ci/lite-action
        - r0adkll/upload-google-play
        - re-actors/alls-green
        - softprops/action-gh-release

services:

  db:
    restart: "no"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    environment: &backend-required-env
      FRONTEND_HOST: ${FRONTEND_HOST?Variable not set}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS?Variable not set}
      SECRET_KEY: ${SECRET_KEY?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/backend/app
        - path: ./backend/scripts
          action: sync
          target: /app/backend/scripts
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
        - path: ./pyproject.toml
          action: rebuild
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov

  prestart:
    environment: *backend-required-env
    develop:
      watch:
        - path: ./backend/app/alembic
          action: sync+restart
          target: /app/backend/app/alembic
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
        - path: ./pyproject.toml
          action: rebuild

  mailcatcher:
    image: schickling/mailcatcher
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1080'"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "5173:5173"
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      - VITE_API_URL=${API_URL?Variable not set}
      - VITE_PROJECT_NAME=${PROJECT_NAME:-Shop n Cook}
    develop:
      watch:
        - path: ./frontend/src
          action: sync
          target: /app/frontend/src
        - path: ./frontend/public
          action: sync
          target: /app/frontend/public
        - path: ./frontend/index.html
          action: sync
          target: /app/frontend/index.html
        - path: ./frontend/vite.config.ts
          action: sync+restart
          target: /app/frontend/vite.config.ts
        - path: ./frontend/package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild

  landing:
    restart: "no"
    ports:
      - "8080:80"
    environment:
      FRONTEND_URL: ${FRONTEND_HOST?Variable not set}
    develop:
      watch:
        - path: ./landing/index.html
          action: sync+restart
          target: /usr/share/nginx/html/index.html.template
        - path: ./landing/privacy.html
          action: sync
          target: /usr/share/nginx/html/privacy.html
        - path: ./landing/nginx.conf
          action: sync+restart
          target: /etc/nginx/conf.d/default.conf
        - path: ./landing/docker-entrypoint.sh
          action: rebuild

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

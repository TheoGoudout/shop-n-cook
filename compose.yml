services:

  db:
    image: postgres:18
    restart: always
    # Every service carries a memory cap, so that on a host shared with other
    # stacks the kernel's OOM killer takes the container that misbehaved
    # instead of Postgres mid-write. The caps are ceilings, not allocations.
    mem_limit: 1g
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_DB} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB:-}
      - POSTGRES_USER=${SERVICE_USER_DB:-}
      - POSTGRES_DB=${POSTGRES_DB:-app}

  backend:
    image: shop-n-cook/backend:${TAG:-latest}
    restart: always
    # One uvicorn worker per WEB_CONCURRENCY, each a full copy of the app; the
    # background price refresh peaks ~160 MB above that in one of them. Lower
    # WEB_CONCURRENCY (and this cap with it) on a small shared host.
    command: ["fastapi", "run", "--workers", "${WEB_CONCURRENCY:-4}", "app/main.py"]
    mem_limit: 1536m
    mem_reservation: 256m
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment: &backend-required-env
      - PROJECT_NAME=${PROJECT_NAME:-Shop n Cook}
      # The frontend is deployed to Cloudflare Workers, not by Coolify, so this
      # is a real domain rather than a SERVICE_URL_* variable. FRONTEND_HOST is
      # always an allowed CORS origin — BACKEND_CORS_ORIGINS adds extra ones.
      - FRONTEND_HOST=${FRONTEND_HOST:-https://app.shop-n-cook.com}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-}
      - SECRET_KEY=${SERVICE_PASSWORD_SECRET:-}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_SUPERUSER:-}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - POSTGRES_USER=${SERVICE_USER_DB:-}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB:-}
      - SENTRY_DSN=${SENTRY_DSN}
      - AI_PROVIDER=${AI_PROVIDER}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - ANTHROPIC_VISION_MODEL=${ANTHROPIC_VISION_MODEL}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL}
      - GOOGLE_VISION_MODEL=${GOOGLE_VISION_MODEL}
      - RECIPE_PHOTO_MAX_COUNT=${RECIPE_PHOTO_MAX_COUNT}
      - RECIPE_PHOTO_MAX_BYTES=${RECIPE_PHOTO_MAX_BYTES}
      - RECIPE_PHOTO_RATE_LIMIT=${RECIPE_PHOTO_RATE_LIMIT}
      - SPOONACULAR_API_KEY=${SPOONACULAR_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-True}
      - BIOCOOP_API_TOKEN=${BIOCOOP_API_TOKEN:-}
      - NATURALIA_API_TOKEN=${NATURALIA_API_TOKEN:-}
      - STORE_PRICE_REFRESH_HOURS=${STORE_PRICE_REFRESH_HOURS:-24}
      - RECIPE_CRAWL_HOURS=${RECIPE_CRAWL_HOURS:-0}
      - RECIPE_CRAWL_MAX_IMPORTS=${RECIPE_CRAWL_MAX_IMPORTS:-10}
      - RECIPE_CRAWL_MAX_PAGES_PER_SITE=${RECIPE_CRAWL_MAX_PAGES_PER_SITE:-20}
      - RECIPE_CRAWL_DELAY_SECONDS=${RECIPE_CRAWL_DELAY_SECONDS:-5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  prestart:
    image: shop-n-cook/backend:${TAG:-latest}
    restart: "no"
    # Runs migrations and exits, so it never overlaps steady state.
    mem_limit: 512m
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    environment: *backend-required-env

# The `frontend` and `landing` services live in `compose.override.yml`: they are
# deployed to Cloudflare Workers in staging and production (see deployment.md),
# so this file — the stack Coolify deploys — carries the backend and database
# only. Compose loads the override file automatically, so `docker compose up`
# still brings up the full local stack.

volumes:
  app-db-data:

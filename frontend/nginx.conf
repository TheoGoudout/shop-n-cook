server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  # Required for PWA install prompt: browsers reject manifests without this type.
  # Must be location-level — a server-level types block would replace all
  # http-inherited MIME types (mime.types), serving sw.js as octet-stream and
  # breaking service worker registration, which prevents Web Share Target.
  location ~* \.webmanifest$ {
    root /usr/share/nginx/html;
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
  }

  # Service worker must never be served from cache — stale SW blocks PWA install
  location ~* (sw\.js|workbox-.+\.js)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
